
<!DOCTYPE html>
<html lang="pt-br" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaintTrack Pro | PCM SharePoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-mesh: radial-gradient(at 0% 0%, hsla(210, 40%, 80%, 0.08) 0, transparent 50%), 
                       radial-gradient(at 50% 0%, hsla(210, 40%, 85%, 0.12) 0, transparent 50%), 
                       radial-gradient(at 100% 0%, hsla(210, 40%, 80%, 0.08) 0, transparent 50%);
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-attachment: fixed;
            background-image: var(--bg-mesh);
            background-color: #f8fafc;
        }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }
    </style>
